services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: alerta_cidadao
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER no arquivo .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [alerta]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Default: "Server=mysql;Port=3306;Database=alerta_cidadao;User=${MYSQL_USER:?Defina MYSQL_USER no arquivo .env};Password=${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Defina JWT_SIGNING_KEY no arquivo .env}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      Monitoring__IntervalMinutes: ${MONITORING_INTERVAL_MINUTES:-10}
      RateLimiting__PermitLimit: ${RATE_LIMIT_PERMIT_LIMIT:-60}
      RateLimiting__WindowMinutes: ${RATE_LIMIT_WINDOW_MINUTES:-1}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [alerta]

networks:
  alerta:
    driver: bridge

volumes:
  mysql_data:
